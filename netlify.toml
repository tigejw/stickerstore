[build]
  functions = "netlify/functions"
  publish = "public"   

[functions]
  node_bundler = "esbuild"
  region="eu-west-1"
  included_files = ["node_modules/pg-format/**"]
  external_node_modules = ["pg-format"]
  
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/handle-stripe-webhook"
  to = "/.netlify/functions/api/handle-stripe-webhook"
  status = 200